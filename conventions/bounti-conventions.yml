  detail: No rate-limit headers observed and none documented. See rate-limits/bounti-rate-limits.yml.
base_url:
  value: https://bounti.ai
  detail: >-
    The API is served from the website root: the provider's own OpenAPI declares
    servers[0].url = https://bounti.ai and both operations are verified live there (200). The
    repair-api-bases pass flags this as a "marketing-base" and returns no-usable-base, which is a
    false positive for this provider — the apex genuinely IS the API host, so apis.yml baseURL is left
    unchanged.
