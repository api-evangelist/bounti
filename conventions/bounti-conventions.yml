  supported: false
metadata:
  supported: false
request_tracing:
  request_id_header: null
  detail: >-
    bounti.ai (Vercel/Next.js) returns no correlation id on the content endpoints. claw.bounti.ai
    (Google Frontend) returns x-cloud-trace-context on every response, including the 401, which is a
    platform trace id rather than a documented client-facing request id.
versioning:
  scheme: none
  detail: >-
    No version appears in the path, a header, or a query parameter. The OpenAPI carries info.version
    1.0.0 and the MCP manifest carries version 1.0.0, but neither is negotiable by a caller and
    neither has changed since first harvest.
content_negotiation:
  request: none
  response_media_types: [text/plain]
  detail: Responses are Markdown served as text/plain; there is no JSON representation of the content.
