notes: >-
  Bounti's public API is two unauthenticated GETs that return Markdown as text/plain. Most
  cross-cutting API semantics simply do not exist here, and that is the honest finding rather than a
  harvesting gap — there is no JSON resource model, so there is nothing to paginate, expand, or make
  idempotent. Recorded so the absence is legible.
authentication:
  style: none
  detail: Anonymous GET. See authentication/bounti-authentication.yml.
idempotency:
  supported: false
  header: null
  detail: >-
    No idempotency key is documented or declared anywhere. Not applicable to the published surface:
    both operations are safe GETs, which are idempotent by HTTP method rather than by contract. No
    Idempotency pointer is emitted in apis.yml — there is no idempotency contract to point at.
pagination:
  supported: false
  detail: Neither operation accepts parameters; each returns one complete document.
