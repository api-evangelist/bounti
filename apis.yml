aid: bounti
name: Bounti
description: >-
  Bounti (Bounti Labs, bounti.ai) is an AI-powered real estate visualization and
  automation platform founded in 2023 by Ashar Rizqi and Matt Cooley and backed
  by GV (Google Ventures), Bloomberg Beta, Floodgate, Haystack, Octave Ventures
  and MS&AD. Its products include AI virtual staging and photo enhancement,
  cinematic listing-photo animation, automated marketing-video creation,
  before/after reveal videos, collaborative client studios, and B.Claw — an AI
  operating system that consolidates 13+ real estate tools (Gmail, calendar,
  CRM, WhatsApp, website builder) into one conversational interface. Bounti does
  not publish a general integration API, but it does expose an agent-facing,
  unauthenticated Content API (advertised via an AI-plugin manifest at
  /.well-known/ai-plugin.json) plus /llms.txt and /llms-full.txt so AI assistants
  can accurately answer questions about its products, pricing, and content.
