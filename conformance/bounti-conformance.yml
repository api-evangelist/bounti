certifications: []
compliance_program:
  published: false
  detail: >-
    No trust center, no certifications page, no compliance page. trust.bounti.ai and
    security.bounti.ai do not resolve; bounti.ai/security, /trust and /compliance all 404. Bounti does
    publish a domain-specific regulatory posture in its product content — a Fair Housing compliance
    skill, an AI Disclosure Compliance skill, and a blog post on California AB 723 AI photo disclosure
    — but that is guidance it sells to real estate agents, not a compliance program it certifies for
    itself, and it must not be read as one.
