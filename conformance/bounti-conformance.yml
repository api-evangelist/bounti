notes: >-
  Bounti conforms to the discovery and agent-facing conventions and to almost nothing else. There is
  no identity, authorization, or industry standard in play because there is no authenticated public
  API. No compliance certifications (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP) are published
  anywhere on any Bounti host, so no Compliance pointer is emitted.
