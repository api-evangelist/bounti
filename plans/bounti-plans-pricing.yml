metering:
  unit: action
  definition: >-
    "One meaningful unit of B.Claw work — drafting an email reply, generating a CMA, running the
    morning briefing, triaging an inbox batch, summarizing a document, or completing a multi-step
    task." Read-only operations (querying the CRM, listing the calendar) do not count.
  rollover: Action allotments roll over within the month, inside the comfort zone.
  overage_increment: 5 USD
  spend_cap:
    name: comfort zone
    default: plan price + $50
    warning_threshold: 80% of plan
    behavior: >-
      Work is not cut off at the allotment; the user sets a monthly spending cap and receives a
      heads-up notification at 80% to raise the cap, upgrade, or pause.
  top_ups: $5 increments, anytime.
plan_changes:
  upgrade: Immediate, prorated.
  downgrade: Takes effect at the next billing cycle.
  commitment: None; month-to-month.
