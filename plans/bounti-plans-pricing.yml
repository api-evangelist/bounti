notes: >-
  These are the published subscription plans for B.Claw, the AI operating system product. They are NOT
  API plans — Bounti sells no API access at any tier and publishes no API pricing. Plans are sized by
  monthly ACTION VOLUME, not by feature gating: the provider states every plan from Free to Heavy
  includes every feature (morning briefings, inbox triage, CMA generation, 250+ tool integrations,
  draft-before-send safety). All plans are month-to-month; the provider states there are no annual or
  volume discounts and no team/brokerage tier ("multi-agent / shared-inbox / brokerage tiers are on the
  roadmap but not shipping today"; brokerage interest goes to sales@bounti.ai). Prices and quotas below
  are transcribed verbatim from the pricing page and its embedded schema.org Product/FAQPage blocks.
  Bounti's separate /real-estate-crm-pricing page was checked and deliberately excluded: it is a
  competitor price-comparison article about other vendors' CRMs, not Bounti's own pricing.
